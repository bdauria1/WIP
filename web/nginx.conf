server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json application/wasm image/svg+xml;
    gzip_min_length 1024;

    # Hashed build output never changes, so cache it hard.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # MediaPipe model and wasm files.
    location /mediapipe/ {
        expires 7d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    # PocketBase API and admin dashboard.
    location ~ ^/(api|_)/ {
        proxy_pass http://pocketbase:8090;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        # Realtime uses server-sent events.
        proxy_buffering off;
        proxy_read_timeout 360s;
        client_max_body_size 10m;
    }

    # Client-side routes (/practice, /signin, ...) all load the app shell.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
